<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>{{ talk_title }}</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #F4F8FF;
      --text: #1f2937;
      --primary-dark: #2563eb;
      --user-bubble: #3b82f6;
      --assistant-bubble: #ffffff;
      --composer-bg: rgba(244, 248, 255, 0.96);
      --composer-bar-height: 96px;
      --emoji-panel-height: 248px;
      --composer-offset: calc(var(--composer-bar-height) + env(safe-area-inset-bottom, 0px));
    }
    .page.emoji-open {
      --composer-offset: calc(var(--composer-bar-height) + var(--emoji-panel-height) + env(safe-area-inset-bottom, 0px));
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--page-bg);
      color: var(--text);
      touch-action: manipulation;
    }
    .page {
      height: 100dvh;
      max-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--page-bg);
    }
    .main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 16px 14px var(--composer-offset);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .main::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    .welcome-panel {
      width: 100%;
      margin: 0 0 14px;
      white-space: normal;
      line-height: normal;
      word-break: normal;
    }
    .welcome-panel > * {
      max-width: 100%;
    }
    .chat {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 120px;
    }
    .msg-row {
      display: flex;
      width: 100%;
      scroll-margin-bottom: var(--composer-offset);
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }
    .msg {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.65;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }
    .msg.user {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 6px;
    }
    .msg.assistant {
      background: var(--assistant-bubble);
      color: var(--text);
      border-bottom-left-radius: 6px;
    }
    .msg.assistant.markdown {
      white-space: normal;
    }
    .msg.assistant.markdown p {
      margin: 0 0 0.6em;
    }
    .msg.assistant.markdown p:last-child {
      margin-bottom: 0;
    }
    .msg.assistant.markdown ul,
    .msg.assistant.markdown ol {
      margin: 0.4em 0 0.6em;
      padding-left: 1.25em;
    }
    .msg.assistant.markdown li {
      margin: 0.2em 0;
    }
    .msg.assistant.markdown pre {
      margin: 0.5em 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f1f5f9;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.assistant.markdown code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.92em;
      background: #f1f5f9;
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    .msg.assistant.markdown pre code {
      background: transparent;
      padding: 0;
    }
    .msg.assistant.markdown h1,
    .msg.assistant.markdown h2,
    .msg.assistant.markdown h3,
    .msg.assistant.markdown h4 {
      margin: 0.5em 0 0.35em;
      font-size: 1em;
      font-weight: 600;
    }
    .msg.assistant.markdown blockquote {
      margin: 0.4em 0;
      padding-left: 0.8em;
      border-left: 3px solid #e2e8f0;
      color: #64748b;
    }
    .msg.assistant.markdown a {
      color: var(--primary-dark);
      text-decoration: underline;
    }
    .msg.assistant.markdown .assistant-html-preview {
      margin: 0.6em 0;
      max-width: 100%;
      overflow-x: auto;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
    }
    .msg.assistant.markdown .assistant-html-preview img {
      max-width: 100%;
      height: auto;
    }
    .msg.assistant.thinking {
      color: #64748b;
      min-width: 72px;
    }
    .thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 20px;
    }
    .thinking-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      animation: thinking-bounce 1.2s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes thinking-bounce {
      0%, 70%, 100% { transform: translateY(0); opacity: 0.45; }
      35% { transform: translateY(-5px); opacity: 1; }
    }
    .composer-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, rgba(244, 248, 255, 0) 0%, rgba(244, 248, 255, 0.92) 24%, var(--composer-bg) 100%);
      backdrop-filter: blur(8px);
    }
    .composer {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .composer__menu,
    .composer__emoji {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .composer__emoji.is-active {
      background: #e0e7ff;
      color: var(--primary-dark);
    }
    .composer__menu svg,
    .composer__emoji svg {
      width: 26px;
      height: 26px;
    }
    .composer__input-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 0 12px 0 16px;
      min-height: 44px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .composer__input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font: inherit;
      font-size: 15px;
      color: var(--text);
      min-width: 0;
    }
    .composer__input::placeholder {
      color: #9ca3af;
    }
    .composer__send {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(145deg, #60a5fa 0%, var(--primary-dark) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.28);
    }
    .composer__send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }
    .composer__send svg {
      width: 22px;
      height: 22px;
    }
    .status {
      max-width: 480px;
      margin: 0 auto 6px;
      padding: 0 4px;
      font-size: 12px;
      color: #dc2626;
      text-align: center;
    }
    .status:empty {
      display: none;
    }
    .emoji-panel {
      display: none;
      max-width: 480px;
      margin: 0 auto 8px;
      height: var(--emoji-panel-height);
      padding: 10px 8px 6px;
      background: #fff;
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -6px 24px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    .page.emoji-open .emoji-panel {
      display: block;
    }
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 2px;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .emoji-grid::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    .emoji-item {
      border: none;
      background: transparent;
      font-size: 24px;
      line-height: 1;
      padding: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .emoji-item:hover {
      background: #f1f5f9;
    }
    .emoji-item:active {
      background: #e2e8f0;
      transform: scale(0.94);
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="page" data-method-key="{{ method_key }}" data-message-api="{{ message_api_url }}" data-redis-key-prefix="{{ redis_key_prefix }}">
    <main class="main">
      {% if welcome_message %}
      <div class="welcome-panel" id="welcome">{{ welcome_message | safe }}</div>
      {% endif %}
      <section class="chat" id="chat" aria-live="polite"></section>
    </main>
    <div class="composer-wrap">
      <div class="status" id="status"></div>
      <div class="emoji-panel" id="emojiPanel" hidden aria-label="表情选择"></div>
      <div class="composer">
        <button class="composer__menu" type="button" aria-label="更多功能" id="menuBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="4" y="4" width="6" height="6" rx="1.2"/>
            <rect x="14" y="4" width="6" height="6" rx="1.2"/>
            <rect x="4" y="14" width="6" height="6" rx="1.2"/>
            <rect x="14" y="14" width="6" height="6" rx="1.2"/>
          </svg>
        </button>
        <div class="composer__input-wrap">
          <label class="visually-hidden" for="input">输入消息</label>
          <input class="composer__input" id="input" type="text" placeholder="有什么问题可以问我" autocomplete="off" />
        </div>
        <button class="composer__emoji" type="button" aria-label="表情" id="emojiBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="9"/>
            <path d="M8.5 10h.01M15.5 10h.01"/>
            <path d="M8.5 15c1.2 1.3 2.6 2 3.5 2s2.3-.7 3.5-2"/>
          </svg>
        </button>
        <button class="composer__send" id="send" type="button" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3.4 20.6 21 12 3.4 3.4l2.8 7.2L16 12l-9.8 1.4-2.8 7.2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script>
{% include '_talk_markdown.js' %}
  </script>
  <script>
    (function () {
      const app = document.querySelector('.page');
      const methodKey = app.dataset.methodKey;
      const messageApi = app.dataset.messageApi;
      const redisKeyPrefix = app.dataset.redisKeyPrefix || '';
      const chat = document.getElementById('chat');
      const main = document.querySelector('.main');
      const input = document.getElementById('input');
      const sendBtn = document.getElementById('send');
      const statusEl = document.getElementById('status');
      const emojiBtn = document.getElementById('emojiBtn');
      const emojiPanel = document.getElementById('emojiPanel');
      const initialSessionId = {{ session_id | tojson }};

      const EMOJIS = [
        '😀', '😃', '😄', '😁', '😆', '😅', '🤣', '😂',
        '🙂', '🙃', '😉', '😊', '😇', '🥰', '😍', '🤩',
        '😘', '😗', '😚', '😙', '🥲', '😋', '😛', '😜',
        '🤪', '😝', '🤑', '🤗', '🤭', '🤫', '🤔', '🤐',
        '😐', '😑', '😶', '😏', '😒', '🙄', '😬', '😌',
        '😔', '😪', '🤤', '😴', '😷', '🤒', '🤕', '🤢',
        '🤮', '🤧', '🥵', '🥶', '🥴', '😵', '🤯', '🥳',
        '😎', '🤓', '🧐', '😕', '😟', '🙁', '☹️', '😮',
        '😯', '😲', '😳', '🥺', '😦', '😧', '😨', '😰',
        '😥', '😢', '😭', '😱', '😖', '😣', '😞', '😓',
        '😩', '😫', '🥱', '😤', '😡', '😠', '🤬', '😈',
        '👍', '👎', '👏', '🙌', '🙏', '💪', '👌', '🤝',
        '❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '💔',
        '💯', '✨', '🔥', '🎉', '🎊', '💡', '❓', '❗'
      ];

      function buildEmojiPanel() {
        const grid = document.createElement('div');
        grid.className = 'emoji-grid';
        EMOJIS.forEach(function (emoji) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'emoji-item';
          btn.textContent = emoji;
          btn.setAttribute('aria-label', '插入表情 ' + emoji);
          btn.addEventListener('click', function () {
            insertEmoji(emoji);
          });
          grid.appendChild(btn);
        });
        emojiPanel.appendChild(grid);
      }

      function insertEmoji(emoji) {
        const start = input.selectionStart == null ? input.value.length : input.selectionStart;
        const end = input.selectionEnd == null ? input.value.length : input.selectionEnd;
        const value = input.value;
        input.value = value.slice(0, start) + emoji + value.slice(end);
        const pos = start + emoji.length;
        input.setSelectionRange(pos, pos);
        input.focus();
      }

      function setEmojiOpen(open) {
        app.classList.toggle('emoji-open', open);
        emojiPanel.hidden = !open;
        emojiBtn.classList.toggle('is-active', open);
        emojiBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) {
          scrollChatToBottom();
        }
      }

      buildEmojiPanel();

      emojiBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        setEmojiOpen(!app.classList.contains('emoji-open'));
      });

      document.addEventListener('click', function (e) {
        if (!app.classList.contains('emoji-open')) return;
        if (emojiPanel.contains(e.target) || emojiBtn.contains(e.target)) return;
        setEmojiOpen(false);
      });

      function getSessionId() {
        if (initialSessionId) return initialSessionId;
        const key = 'flowgame_talk_session_' + methodKey;
        let id = localStorage.getItem(key);
        if (!id) {
          id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
          localStorage.setItem(key, id);
        }
        return id;
      }

      function scrollChatToBottom() {
        requestAnimationFrame(function () {
          if (!main)
            return
          main.scrollTo({ top: main.scrollHeight, behavior: 'smooth' })
        })
      }

      function appendMessage(role, content, html) {
        const row = document.createElement('div');
        row.className = 'msg-row ' + role;
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        if (html) {
          div.innerHTML = content;
        } else if (role === 'assistant') {
          div.classList.add('markdown');
          div.innerHTML = renderAssistantMarkdown(content);
        } else {
          div.textContent = content;
        }
        row.appendChild(div);
        chat.appendChild(row);
        scrollChatToBottom();
        return row;
      }

      let thinkingRow = null;

      function showThinkingBubble() {
        removeThinkingBubble();
        const row = document.createElement('div');
        row.className = 'msg-row assistant';
        row.id = 'thinking-row';
        const div = document.createElement('div');
        div.className = 'msg assistant thinking';
        div.setAttribute('aria-label', '思考中');
        div.innerHTML = '<span class="thinking-dots" aria-hidden="true"><span></span><span></span><span></span></span>';
        row.appendChild(div);
        chat.appendChild(row);
        thinkingRow = row;
        scrollChatToBottom();
      }

      function removeThinkingBubble() {
        if (thinkingRow && thinkingRow.parentNode) {
          thinkingRow.parentNode.removeChild(thinkingRow);
        }
        thinkingRow = null;
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        setEmojiOpen(false);
        appendMessage('user', text);
        input.value = '';
        sendBtn.disabled = true;
        statusEl.textContent = '';
        showThinkingBubble();
        try {
          const res = await fetch(messageApi, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(redisKeyPrefix ? { 'X-Flowgame-Redis-Key-Prefix': redisKeyPrefix } : {})
            },
            body: JSON.stringify({
              methodKey,
              message: text,
              sessionId: getSessionId(),
              ...(redisKeyPrefix ? { redisKeyPrefix } : {})
            })
          });
          const payload = await res.json();
          if (!res.ok || payload.code !== 200) {
            throw new Error(payload.msg || payload.detail || '请求失败');
          }
          const assistant = payload.data && payload.data.assistantMessage;
          const content = (assistant && assistant.content) || '(无回复)';
          removeThinkingBubble();
          appendMessage('assistant', content, false);
          statusEl.textContent = '';
        } catch (err) {
          removeThinkingBubble();
          statusEl.textContent = err.message || String(err);
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendMessage();
        }
      });
    })();
  </script>
</body>
</html>
