<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ talk_title }}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
      --assistant: #f3f4f6;
      --user: #dbeafe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: min(960px, 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }
    header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    header h1 {
      margin: 0;
      font-size: 20px;
    }
    .welcome {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .chat {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 420px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant);
    }
    .composer {
      display: flex;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    textarea {
      flex: 1;
      min-height: 72px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }
    button {
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      padding: 0 18px;
      font: inherit;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="app" data-method-key="{{ method_key }}" data-message-api="{{ message_api_url }}" data-redis-key-prefix="{{ redis_key_prefix }}">
    <header>
      <h1>{{ talk_title }}</h1>
      {% if welcome_message %}
      <div class="welcome" id="welcome">{{ welcome_message | safe }}</div>
      {% endif %}
    </header>
    <div class="chat" id="chat"></div>
    <div class="status" id="status"></div>
    <div class="composer">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" type="button">发送</button>
    </div>
  </div>
  <script>
    (function () {
      const app = document.querySelector('.app');
      const methodKey = app.dataset.methodKey;
      const messageApi = app.dataset.messageApi;
      const redisKeyPrefix = app.dataset.redisKeyPrefix || '';
      const chat = document.getElementById('chat');
      const input = document.getElementById('input');
      const sendBtn = document.getElementById('send');
      const statusEl = document.getElementById('status');
      const initialSessionId = {{ session_id | tojson }};

      function getSessionId() {
        if (initialSessionId) return initialSessionId;
        const key = 'flowgame_talk_session_' + methodKey;
        let id = localStorage.getItem(key);
        if (!id) {
          id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
          localStorage.setItem(key, id);
        }
        return id;
      }

      function appendMessage(role, content) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = content;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        appendMessage('user', text);
        input.value = '';
        sendBtn.disabled = true;
        statusEl.textContent = '思考中…';
        try {
          const res = await fetch(messageApi, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(redisKeyPrefix ? { 'X-Flowgame-Redis-Key-Prefix': redisKeyPrefix } : {})
            },
            body: JSON.stringify({
              methodKey,
              message: text,
              sessionId: getSessionId(),
              ...(redisKeyPrefix ? { redisKeyPrefix } : {})
            })
          });
          const payload = await res.json();
          if (!res.ok || payload.code !== 200) {
            throw new Error(payload.msg || payload.detail || '请求失败');
          }
          const assistant = payload.data && payload.data.assistantMessage;
          appendMessage('assistant', (assistant && assistant.content) || '(无回复)');
          statusEl.textContent = '';
        } catch (err) {
          statusEl.textContent = err.message || String(err);
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    })();
  </script>
</body>
</html>
